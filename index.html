<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Battle Miner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud">
    <h1>Mini Battle Miner</h1>
    <p>Move: <strong>WASD / Arrow Keys</strong> • Mine: <strong>E</strong> near trees or rocks</p>
    <div class="stats">
      <span>Wood: <strong id="wood-count">0</strong></span>
      <span>Stone: <strong id="stone-count">0</strong></span>
    </div>
  </div>

  <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
